plugins { id 'com.android.application' }
android {
    namespace 'app.worldwide'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'app.worldwide'; minSdk 26; targetSdk 36; versionCode 9; versionName '0.1.8'; testInstrumentationRunner 'app.worldwide.NativeSmokeTests' }
    if (providers.gradleProperty('worldwideNativeTest').orNull == 'true') {
        defaultConfig { applicationId 'app.worldwide.nativetest' }
    }
    // Disposable, separate package for update-retention tests; production identity is unchanged.
    if (providers.gradleProperty('worldwideUpdateTest').orNull == 'true') {
        defaultConfig {
            applicationId 'app.worldwide.updatetest'
            versionCode Integer.parseInt(providers.gradleProperty('worldwideTestCode').get())
            versionName providers.gradleProperty('worldwideTestVersion').get()
        }
    }
    if (providers.gradleProperty('worldwideReleaseRetentionTest').orNull == 'true') {
        defaultConfig { testApplicationId 'app.worldwide.releaseretentiontest' }
    }
    if (providers.gradleProperty('worldwideWidgetTest').orNull == 'true') {
        defaultConfig { applicationId 'app.worldwide.widgettest' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('WORLDWIDE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('WORLDWIDE_ANDROID_KEYSTORE'))
                storePassword System.getenv('WORLDWIDE_ANDROID_KEY_PASSWORD')
                keyAlias 'worldwide'
                keyPassword System.getenv('WORLDWIDE_ANDROID_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies {
    // Embedded ZXing expects ContextCompat/ActivityCompat but omits them from its POM.
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
